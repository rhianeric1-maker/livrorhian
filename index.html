<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Cozinha dos Meus Sogros</title>
<meta name="description" content="Um relato de Rhian.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;background:#241C18;font-family:Lora,Georgia,serif;display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#book{animation:intro 1.1s ease-out;position:relative;flex:none;height:600px;perspective:2600px;transition:transform .9s cubic-bezier(.5,.1,.2,1);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet{position:absolute;top:0;left:50%;width:420px;height:600px;transform-origin:left center;transform-style:preserve-3d;transition:transform .35s ease}
.single .sheet{left:0}
.sheet.flipped{transform:rotateY(-180deg)}
.single .sheet.flipped{visibility:hidden;transition:visibility 0s .95s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg);background:linear-gradient(270deg,rgba(60,40,20,.18),rgba(60,40,20,0) 7%),#F3EAD6}
.face.front{background:linear-gradient(90deg,rgba(60,40,20,.18),rgba(60,40,20,0) 7%),#F6EEDD;box-shadow:2px 0 8px rgba(0,0,0,.3)}
.face.front.cover{background:#1F3B40;border-radius:0 8px 8px 0;box-shadow:inset 0 0 0 12px #1F3B40,inset 0 0 0 13px #C9A25A,4px 0 14px rgba(0,0,0,.45);color:#F6EEDD;padding:64px 40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cover h1{margin:0;font:500 38px/1.15 Lora,Georgia,serif}
.cover svg{width:250px;height:auto;margin:48px 0}
.cover p{margin:auto 0 0;font-style:italic;font-size:18px}
.in{width:420px;height:600px;padding:46px 42px 56px;overflow:hidden;font-size:15.5px;line-height:1.62;color:#2E2018;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.in h2{margin:6px 0 10px;font:500 27px/1.2 Lora,Georgia,serif;text-align:center;hyphens:none}
.rule{display:block;width:40px;height:2px;background:#B4532F;margin:0 auto 16px}
.in p{margin:0 0 .75em}
.run{font-style:italic;font-size:12px;color:#6B5646;text-align:center;margin-bottom:18px}
.ill{margin:14px 0 16px;border-radius:3px;overflow:hidden}
.ill svg{display:block;width:100%;height:auto}
.num{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:#6B5646}
nav{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0 14px;color:#CDBFA8;font-size:14px}
nav button{width:44px;height:44px;border-radius:22px;border:1px solid #5A4A3E;background:#3A2E27;color:#F6EEDD;font-size:24px;line-height:1;cursor:pointer}
nav button:disabled{opacity:.35;cursor:default}
nav button:focus-visible{outline:2px solid #C9A25A;outline-offset:2px}
#pos{min-width:130px;text-align:center}
#measure{position:absolute;left:-9999px;top:0}
@keyframes intro{from{opacity:0;filter:blur(6px)}}
@keyframes goF{0%{transform:rotateY(0)}45%{transform:rotateY(-80deg) translateZ(70px) skewY(-3deg)}100%{transform:rotateY(-180deg)}}
@keyframes goB{0%{transform:rotateY(-180deg)}55%{transform:rotateY(-100deg) translateZ(70px) skewY(3deg)}100%{transform:rotateY(0)}}
.goF{animation:goF .95s cubic-bezier(.45,.05,.25,1) both}
.goB{animation:goB .95s cubic-bezier(.45,.05,.25,1) both}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--sh,0);background:linear-gradient(90deg,rgba(40,25,10,.5),rgba(40,25,10,0) 75%)}
.face.back::after{background:linear-gradient(270deg,rgba(40,25,10,.5),rgba(40,25,10,0) 75%)}
.goF .face::after,.goB .face::after{animation:shade .95s ease-in-out}
@keyframes shade{0%,100%{opacity:0}50%{opacity:1}}
#book:not(.single) .sheet.top:not(.flipped):hover{transform:rotateY(-6deg)}
@keyframes drift{to{transform:scale(1.05) translate(-1%,-1%)}}
@keyframes steam{from{transform:translateY(4px);opacity:.85}to{transform:translateY(-12px);opacity:.25}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.ill svg{animation:drift 10s ease-in-out infinite alternate}
.ill svg path[stroke="#fff"],.cover svg path[stroke="#F6EEDD"]{transform-box:fill-box;animation:steam 2.6s ease-in-out infinite alternate}
.ill svg path[stroke="#5E8A5A"]{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<template id="cover-tpl"><h1>A Cozinha dos Meus Sogros</h1><svg viewBox="0 0 300 260" role="img" aria-label="Panela com vapor sobre um fogão"><circle cx="150" cy="130" r="120" fill="#2D5159"/><rect x="95" y="140" width="110" height="64" rx="8" fill="#9AA9B0"/><rect x="85" y="132" width="130" height="14" rx="7" fill="#C5D0D5"/><path d="M120 120Q105 90 124 66M150 120Q166 90 148 62M180 120Q168 94 184 74" stroke="#F6EEDD" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9"/><rect x="60" y="204" width="180" height="16" rx="6" fill="#C9A25A"/></svg><p>Um relato de Rhian</p></template>

<script>
/* Para acrescentar o final: adicione, no fim da lista abaixo, {t:"O que eu quero deixar",svg:"",p:["texto..."]} */
const CH=[{"t": "A cozinha", "svg": "<svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Um casal cozinhando junto, visto da porta\"><rect fill=\"#F7DDB5\"/><rect x=\"90\" y=\"50\" width=\"120\" height=\"100\" fill=\"#FFF3C4\"/><path d=\"M150 50V150M90 100H210\" stroke=\"#C98B5A\" stroke-width=\"6\"/><rect y=\"250\" width=\"640\" height=\"150\" fill=\"#B9774E\"/><rect y=\"240\" width=\"640\" height=\"16\" fill=\"#D9A06F\"/><rect x=\"290\" y=\"205\" width=\"70\" height=\"40\" fill=\"#6F7C85\"/><path d=\"M310 195Q295 170 312 150M340 195Q355 170 338 150\" stroke=\"#fff\" stroke-width=\"8\" fill=\"none\" stroke-linecap=\"round\" opacity=\".8\"/><path d=\"M130 250Q125 170 160 150Q195 170 190 250Z\" fill=\"#5E86A6\"/><circle cx=\"160\" cy=\"125\" r=\"22\" fill=\"#E0AE86\"/><path d=\"M138 120Q145 98 172 102Q184 112 182 120Q162 108 138 120Z\" fill=\"#4A3426\"/><path d=\"M400 250Q395 170 430 150Q465 170 460 250Z\" fill=\"#D9774F\"/><circle cx=\"430\" cy=\"125\" r=\"22\" fill=\"#C98F68\"/><path d=\"M408 122Q410 96 438 100Q456 108 452 126Q446 108 408 122Z\" fill=\"#3B2A22\"/><path d=\"M190 190L290 215M400 190L360 215\" stroke=\"#5E86A6\" stroke-width=\"16\" stroke-linecap=\"round\"/><rect width=\"40\" height=\"400\" fill=\"#6B3F26\"/><rect x=\"600\" width=\"40\" height=\"400\" fill=\"#6B3F26\"/><rect width=\"640\" height=\"24\" fill=\"#5A3320\"/></svg>", "p": ["Na primeira vez que entrei na casa da minha noiva, parei na porta da cozinha e fiquei olhando.", "Os pais dela estavam cozinhando juntos. Ele cortava, ela mexia a panela, os dois conversavam e riam, como se aquilo fosse a coisa mais comum do mundo. E para eles era. Para mim, foi como ver uma cena de um filme de um país distante.", "Eu nunca tinha visto meu pai e minha mãe fazendo nada juntos. Nem uma refeição, nem um café da tarde. E ali, naquela cozinha com cheiro de casa de verdade, minha vida inteira começou a passar pela cabeça, rápido demais.", "Eu estranhei. Depois fiquei feliz. E, sem que ninguém percebesse, meus olhos ficaram quentes.", "Para entender por que uma cena tão simples me abalou tanto, preciso voltar no tempo."]}, {"t": "Uma criança feliz", "svg": "", "p": ["Eu fui uma criança feliz. Quero começar dizendo isso, porque é verdade. Mesmo nos momentos mais difíceis, eu era um menino obediente, que brincava, que se divertia, que amava os bichos. Cachorro, gato, papagaio, qualquer criatura que aparecesse, eu queria cuidar. Talvez, lá no fundo, eu já soubesse que cuidar era o meu jeito de amar.", "Meus pais eram separados, e a briga para decidir com quem eu ia ficar foi feia. Eles brigavam muito, e eu, no meio, só queria que a guerra acabasse. Hoje, por sorte e por maturidade, eles são amigos. Guardo isso como uma das vitórias mais bonitas da minha família.", "Fui criado, em grande parte, dentro de uma casa de mulheres: minha mãe e minha irmã mais velha. Foi com elas que aprendi a proteger. Minha mãe trabalhava o dia inteiro e, quando faltava comida, ela deixava de comer para a gente comer. Isso eu nunca esqueci.", "A gente era muito pobre. Mas, naquela época, pobreza era só um detalhe. O que de fato me feriu veio depois."]}, {"t": "A Eliana", "svg": "<svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Barraca na porta de uma casinha humilde\"><rect fill=\"#BFE0E6\"/><rect y=\"320\" width=\"640\" height=\"80\" fill=\"#C9A878\"/><rect x=\"60\" y=\"130\" width=\"250\" height=\"190\" fill=\"#E9C9A0\"/><polygon points=\"45,130 185,60 325,130\" fill=\"#B9553F\"/><rect x=\"150\" y=\"210\" width=\"70\" height=\"110\" fill=\"#6B3F26\"/><rect x=\"90\" y=\"170\" width=\"40\" height=\"40\" fill=\"#FFF3C4\"/><rect x=\"380\" y=\"240\" width=\"200\" height=\"80\" fill=\"#D9774F\"/><rect x=\"370\" y=\"230\" width=\"220\" height=\"16\" fill=\"#E8B04A\"/><path d=\"M480 120V230\" stroke=\"#6B3F26\" stroke-width=\"6\"/><path d=\"M380 120Q480 60 580 120Z\" fill=\"#E8B04A\"/><path d=\"M380 120Q405 140 430 120Q455 140 480 120Q505 140 530 120Q555 140 580 120\" fill=\"#fff\"/><rect x=\"410\" y=\"205\" width=\"50\" height=\"14\" rx=\"7\" fill=\"#E8B04A\"/><rect x=\"420\" y=\"209\" width=\"30\" height=\"6\" rx=\"3\" fill=\"#C0392B\"/><rect x=\"500\" y=\"260\" width=\"64\" height=\"40\" rx=\"6\" fill=\"#FFF3C4\"/><text x=\"532\" y=\"288\" text-anchor=\"middle\" font-size=\"22\" font-family=\"Georgia, serif\" fill=\"#3B2418\">2,50</text><path d=\"M424 195Q414 175 428 160\" stroke=\"#fff\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "p": ["Antes de seguir, preciso falar de uma pessoa que merece um lugar de honra nesta história: a Eliana, esposa do meu pai, minha madrasta.", "Ela não tinha obrigação nenhuma de cuidar de mim. Mesmo assim, sempre cuidou, sempre me tratou com respeito, e eu sinto que ela fez parte da minha educação. Teve dia em que eu fingia estar passando mal na escola só para ficar perto dela, para brincar com ela, para sentir que tinha colo.", "Quando meu pai e ela se mudaram para a casa onde moram hoje, eles não tinham nada. Às vezes faltava dinheiro até para a comida. A gente fazia espetinho debaixo do pé de goiaba, porque era o que dava. E ela, mesmo assim, tinha um carinho enorme com o meu pai e com todo mundo ao redor. Ali eu aprendi que amor de verdade não precisa de coisa nenhuma para existir.", "Antes disso, ela morava numa kitnet, que na verdade era uma casinha de um cômodo e um banheiro, bem humilde mesmo. Foi na porta dessa casa que ela montou uma barraquinha de cachorro-quente para empreender. Sem medo de nada, foi lá, investiu e começou a fazer e vender. O cachorro-quente custava 2,50, e foi um dos melhores que já comi na vida. Meu pai deixava 2,50 separados para mim, e eu comprava o meu direto da mão dela.", "É com ela e com meu pai que tenho a minha irmãzinha caçula, que sempre foi maravilhosa e inteligente, e que eu amo demais."]}, {"t": "Aos sete anos", "svg": "", "p": ["Aos sete anos de idade, vi pela primeira vez a minha mãe ser agredida dentro de casa. Foi pelo Douglas, um dos padrastos que passaram pela minha vida.", "Eu lembro de ter corrido para pegar uma faca. Sete anos. A minha cabeça de criança só sabia uma forma de proteger a minha mãe, e era essa. Ninguém deveria sentir algo assim tão cedo.", "A verdade é que a minha mãe também batia nele. Ela sempre teve dificuldade com a raiva, com a compulsão de explodir, e hoje eu consigo olhar para isso sem deixar de amá-la. O Douglas era um homem perigoso. Hoje eu sei que ele era matador de aluguel, mas naquela época eu não sabia de nada. Ele já tinha sido preso, e certa vez, numa ocasião que não tem data na minha memória, apontou uma arma para mim. Eu tinha sete, oito anos, nove no máximo. Não sei se ele quis só me assustar ou se estava brincando. Sei que a criança que eu era nunca mais esqueceu.", "O Douglas tinha um filho, também chamado Pedro, que virou meu irmão de coração. A gente crescia junto e brincava junto. Um dia, o Douglas saiu e mandou a gente não fazer bagunça. Mas o Pedro encostou num vaso, e o vaso caiu e quebrou. Quando ele chegou, estava com tanta raiva que bateu em nós dois com uma correia de fivela de ferro. Doía demais. Eu nunca esqueci.", "Depois, quando o pai dele já tinha se separado da minha mãe, o Pedro às vezes nem podia vir lá em casa. Ele também tinha os problemas dele em família, e dizia que gostava de vir para brincar comigo.", "Depois vieram outras coisas. Minha mãe, carente de amor depois da separação, deixou entrar em casa pessoas que não deveriam ter entrado. Um deles andava pela casa sem respeitar ninguém, e isso machucou muito a minha irmã. Ela mergulhou numa depressão profunda e tentou tirar a própria vida.", "Ela não conseguiu. E eu agradeço a Deus por isso todos os dias, porque hoje ela é uma das pessoas que mais me inspiram e que eu mais amo neste mundo."]}, {"t": "Dia das Mães", "svg": "<svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Duas crianças colhendo flores vermelhas na beira de um brejo\"><rect fill=\"#FCE9C8\"/><circle cx=\"520\" cy=\"90\" r=\"42\" fill=\"#F6C762\"/><rect y=\"250\" width=\"640\" height=\"150\" fill=\"#8DB5A0\"/><ellipse cx=\"400\" cy=\"330\" rx=\"210\" ry=\"50\" fill=\"#6FA3B5\"/><path d=\"M60 250V150M90 250V130M120 250V160M520 280V190M550 280V170M580 280V200\" stroke=\"#5E8A5A\" stroke-width=\"7\" stroke-linecap=\"round\"/><g fill=\"#C0392B\"><circle cx=\"90\" cy=\"300\" r=\"12\"/><circle cx=\"130\" cy=\"330\" r=\"12\"/><circle cx=\"180\" cy=\"310\" r=\"12\"/><circle cx=\"230\" cy=\"345\" r=\"12\"/></g><path d=\"M90 312V345M130 342V370M180 322V350M230 357V380\" stroke=\"#5E8A5A\" stroke-width=\"5\"/><path d=\"M270 330Q262 270 295 255Q320 270 318 330Z\" fill=\"#E8B04A\"/><circle cx=\"294\" cy=\"238\" r=\"16\" fill=\"#E0AE86\"/><path d=\"M278 236Q282 218 300 222Q312 228 310 238Q296 230 278 236Z\" fill=\"#4A3426\"/><path d=\"M345 335Q340 285 365 272Q388 285 384 335Z\" fill=\"#4F8A8B\"/><circle cx=\"365\" cy=\"256\" r=\"14\" fill=\"#C98F68\"/><path d=\"M352 254Q356 238 370 241Q380 246 378 254Q366 248 352 254Z\" fill=\"#3B2A22\"/><circle cx=\"318\" cy=\"296\" r=\"9\" fill=\"#C0392B\"/><circle cx=\"342\" cy=\"298\" r=\"9\" fill=\"#C0392B\"/></svg>", "p": ["Não tinha dinheiro para comprar presente. Então, no Dia das Mães, eu e a minha irmã passamos na beirada de um brejo e juntamos um punhado de flores vermelhas. Eu estava feliz da vida quando fomos entregar para a nossa mãe.", "Mas ela estava com o olho roxo. A gente descobriu que, na véspera, ela tinha sido espancada pelo ex-namorado, que batia muito nela, e que tentaram até jogá-la de um carro. Entreguei as flores do brejo para uma mãe machucada. Essa cena nunca saiu de dentro de mim."]}, {"t": "O dia do Pedrinho", "svg": "<svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Um menino em pé, chorando, ao lado de um caixão pequeno com uma flor vermelha\" stroke=\"#3B2418\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect width=\"640\" height=\"400\" fill=\"#D8DFE3\" stroke=\"none\"/><rect y=\"330\" width=\"640\" height=\"70\" fill=\"#B7C7A6\" stroke=\"none\"/><rect x=\"270\" y=\"215\" width=\"320\" height=\"115\" rx=\"12\" fill=\"#D9A56B\"/><rect x=\"270\" y=\"215\" width=\"320\" height=\"30\" rx=\"12\" fill=\"#C48A52\"/><rect x=\"360\" y=\"270\" width=\"140\" height=\"12\" rx=\"6\" fill=\"#E8B04A\"/><path d=\"M430 215V185\" stroke=\"#5E8A5A\" stroke-width=\"5\"/><circle cx=\"430\" cy=\"176\" r=\"13\" fill=\"#C0392B\"/><circle cx=\"414\" cy=\"190\" r=\"9\" fill=\"#C0392B\"/><rect x=\"146\" y=\"318\" width=\"20\" height=\"56\" fill=\"#3B4A5A\"/><rect x=\"178\" y=\"318\" width=\"20\" height=\"56\" fill=\"#3B4A5A\"/><rect x=\"138\" y=\"366\" width=\"36\" height=\"14\" rx=\"6\" fill=\"#6B3F26\"/><rect x=\"172\" y=\"366\" width=\"36\" height=\"14\" rx=\"6\" fill=\"#6B3F26\"/><path d=\"M128 322Q122 205 172 192Q222 205 216 322Z\" fill=\"#5E86A6\"/><path d=\"M200 230Q206 280 204 300\" stroke=\"#5E86A6\" stroke-width=\"14\" fill=\"none\"/><circle cx=\"172\" cy=\"150\" r=\"30\" fill=\"#E7B48E\"/><path d=\"M142 148Q142 116 174 118Q204 122 202 146Q172 132 142 148Z\" fill=\"#4A3426\"/><path d=\"M178 152Q186 158 194 152\" fill=\"none\" stroke-width=\"3\"/><path d=\"M180 176Q188 168 196 176\" fill=\"none\" stroke-width=\"3\"/><path d=\"M150 214L182 160\" stroke=\"#5E86A6\" stroke-width=\"14\" fill=\"none\"/><circle cx=\"184\" cy=\"158\" r=\"10\" fill=\"#E7B48E\"/><path d=\"M190 176Q194 184 190 190Q186 184 190 176Z\" fill=\"#7FB5E0\" stroke-width=\"2\"/><path d=\"M200 164Q204 172 200 178Q196 172 200 164Z\" fill=\"#7FB5E0\" stroke-width=\"2\"/></svg>", "p": ["Foi nessa mesma época, quando a minha irmã afundava na depressão, que perdi meu irmão, o Pedrinho, filho do meu pai.", "Lembro de cada detalhe daquele dia. Eu estava no quarto, jogando Minecraft, quando a minha tia apareceu em casa. Ela nunca aparecia. Já achei estranho. Depois minha mãe abriu a porta do quarto, com um jeito que eu nunca tinha visto, e disse:", "— Filho, o Pedrinho foi morar com o Papai do Céu.", "O jogo continuou rodando na tela. O mundo inteiro tinha parado, mas o jogo continuou.", "O Pedrinho tinha só dez meses de vida. Desde que nasceu, deu sinais de que algo não ia bem. Todo mundo dizia que era pneumonia, mas não era: havia uma veia que jorrava sangue dentro do pulmãozinho dele, e isso o fazia sofrer muito. Ele se foi por negligência médica, e essa é uma dor que a minha família carrega até hoje.", "No enterro, eu quis carregar o caixão do meu irmão. Me abaixei para segurar a alça e percebi que só cabiam dois dedos meus. Dois dedos. O caixão era tão pequeno que a minha mão de menino quase não encontrava onde segurar.", "Foi quando levantei a cabeça, olhei para a direita e vi o meu pai chorando. Chorando muito. Era a primeira vez que eu via o meu pai chorar na minha frente. A gente caminhava em direção à cova, eu com dois dedos na alça, ele com o coração em pedaços.", "A gente era tão pobre que nem tinha condições de dar um enterro digno ao Pedrinho. Meu pai precisou pedir ajuda aos outros para sepultar o próprio filho, e eu vi no rosto dele o quanto isso doía, o quanto era humilhante. Eu era só um menino, mas entendi ali, de um jeito que nenhuma criança deveria entender, o peso que a pobreza pode ter."]}, {"t": "A Lurdinha", "svg": "<svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Uma bandeja de pão de queijo ao lado de uma cama, com luz suave de janela\"><rect fill=\"#EBD9C4\"/><rect x=\"420\" y=\"40\" width=\"150\" height=\"170\" fill=\"#FFF3C4\"/><path d=\"M495 40V210M420 125H570\" stroke=\"#C98B5A\" stroke-width=\"6\"/><polygon points=\"420,210 570,210 380,400 130,400\" fill=\"#FFF3C4\" opacity=\".55\"/><rect y=\"320\" width=\"640\" height=\"80\" fill=\"#B9774E\"/><rect x=\"40\" y=\"250\" width=\"320\" height=\"110\" rx=\"12\" fill=\"#5E86A6\"/><rect x=\"40\" y=\"215\" width=\"90\" height=\"50\" rx=\"22\" fill=\"#FFFDF4\"/><rect x=\"380\" y=\"250\" width=\"14\" height=\"110\" fill=\"#6B3F26\"/><rect x=\"394\" y=\"215\" width=\"190\" height=\"14\" rx=\"4\" fill=\"#6B3F26\"/><rect x=\"420\" y=\"229\" width=\"14\" height=\"131\" fill=\"#6B3F26\"/><rect x=\"550\" y=\"229\" width=\"14\" height=\"131\" fill=\"#6B3F26\"/><ellipse cx=\"490\" cy=\"205\" rx=\"80\" ry=\"12\" fill=\"#E8D3A0\"/><g fill=\"#E8B04A\"><circle cx=\"445\" cy=\"185\" r=\"17\"/><circle cx=\"485\" cy=\"178\" r=\"17\"/><circle cx=\"525\" cy=\"185\" r=\"17\"/><circle cx=\"465\" cy=\"162\" r=\"15\"/><circle cx=\"505\" cy=\"160\" r=\"15\"/></g><path d=\"M470 140Q460 120 474 105M510 138Q522 118 508 100\" stroke=\"#fff\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\" opacity=\".8\"/></svg>", "p": ["Cerca de um ano depois, a morte voltou a bater na minha porta. Entre as pessoas que marcaram essa caminhada, uma tem lugar especial: a Lurdinha.", "Ela era uma tia de consideração, dessas que não têm laço de sangue e têm laço de alma. Sempre tinha carinho para mim. Me dava cem reais, e uma bandeja de pão de queijo que eu esperava como quem espera um presente de Natal.", "Um dia, o câncer tomou conta do corpo dela. A última vez que a vi, ela estava deitada na cama, magrinha, e eu, do jeito inocente que tenho, pedi:", "— Você tem que melhorar logo para fazer pão de queijo para mim.", "Ela me olhou com os olhos cheios de lágrimas, mas cheios de esperança também, com uma paz no coração que eu nunca vou esquecer, e respondeu que não teria como. Que eu ia ter que aprender sozinho.", "Foi uma das despedidas mais bonitas que já vi. Ela partiu em paz, e me deixou uma lição: a gente aprende a seguir sozinho, mas nunca sem amor."]}, {"t": "A falta do meu pai", "svg": "<svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Um menino sentado diante do computador e o pai sentado ao lado, ensinando\" stroke=\"#3B2418\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect width=\"640\" height=\"400\" fill=\"#F3D9A8\" stroke=\"none\"/><rect y=\"340\" width=\"640\" height=\"60\" fill=\"#C9A878\" stroke=\"none\"/><rect x=\"100\" y=\"258\" width=\"14\" height=\"82\" fill=\"#8A5A3A\"/><rect x=\"526\" y=\"258\" width=\"14\" height=\"82\" fill=\"#8A5A3A\"/><rect x=\"80\" y=\"240\" width=\"480\" height=\"18\" rx=\"4\" fill=\"#B9774E\"/><rect x=\"335\" y=\"212\" width=\"30\" height=\"30\" fill=\"#6F7C85\"/><rect x=\"250\" y=\"80\" width=\"200\" height=\"136\" rx=\"10\" fill=\"#3B4A5A\"/><rect x=\"262\" y=\"92\" width=\"176\" height=\"112\" rx=\"4\" fill=\"#BFE0E6\" stroke=\"none\"/><ellipse cx=\"350\" cy=\"165\" rx=\"56\" ry=\"16\" fill=\"#7FA05A\"/><circle cx=\"350\" cy=\"153\" r=\"13\" fill=\"#F2A7B8\"/><rect x=\"285\" y=\"228\" width=\"130\" height=\"12\" rx=\"5\" fill=\"#8E9BA3\"/><rect x=\"118\" y=\"225\" width=\"14\" height=\"90\" rx=\"4\" fill=\"#8A5A3A\"/><rect x=\"118\" y=\"300\" width=\"112\" height=\"14\" rx=\"4\" fill=\"#8A5A3A\"/><rect x=\"190\" y=\"314\" width=\"18\" height=\"52\" fill=\"#5E86A6\"/><rect x=\"190\" y=\"360\" width=\"34\" height=\"14\" rx=\"6\" fill=\"#6B3F26\"/><path d=\"M148 300Q140 215 180 205Q212 215 208 300Z\" fill=\"#E8B04A\"/><path d=\"M205 238L282 232\" stroke=\"#E8B04A\" stroke-width=\"14\" fill=\"none\"/><circle cx=\"188\" cy=\"178\" r=\"25\" fill=\"#E7B48E\"/><path d=\"M163 176Q163 150 190 152Q213 156 211 170Q194 162 163 176Z\" fill=\"#4A3426\"/><circle cx=\"200\" cy=\"178\" r=\"3\" fill=\"#3B2418\" stroke=\"none\"/><path d=\"M195 190Q203 196 211 189\" fill=\"none\" stroke-width=\"3\"/><rect x=\"510\" y=\"225\" width=\"14\" height=\"90\" rx=\"4\" fill=\"#8A5A3A\"/><rect x=\"418\" y=\"300\" width=\"106\" height=\"14\" rx=\"4\" fill=\"#8A5A3A\"/><rect x=\"432\" y=\"314\" width=\"22\" height=\"52\" fill=\"#3B4A5A\"/><rect x=\"418\" y=\"360\" width=\"38\" height=\"14\" rx=\"6\" fill=\"#6B3F26\"/><path d=\"M450 300Q440 195 490 188Q536 198 530 300Z\" fill=\"#4F8A8B\"/><path d=\"M468 228L420 220\" stroke=\"#4F8A8B\" stroke-width=\"18\" fill=\"none\"/><circle cx=\"414\" cy=\"218\" r=\"10\" fill=\"#B98262\"/><circle cx=\"490\" cy=\"150\" r=\"30\" fill=\"#B98262\"/><path d=\"M458 148Q458 116 492 118Q524 124 522 146Q490 132 458 148Z\" fill=\"#2E2018\"/><circle cx=\"476\" cy=\"148\" r=\"3\" fill=\"#3B2418\" stroke=\"none\"/><path d=\"M470 164Q480 172 490 164\" fill=\"none\" stroke-width=\"3\"/></svg>", "p": ["Meu pai, hoje, é uma pessoa extraordinária na minha vida, e eu sou muito grato a ele. Mas preciso ser sincero: durante muito tempo, senti a falta dele.", "Ele tinha outra família para cuidar, e a minha irmãzinha precisava mais da atenção dele. Eu entendo, e não guardo rancor nenhum. Mesmo assim, algumas coisas ficaram faltando. Ele nunca me ensinou a fazer a barba. Nunca me ensinou a conversar com uma menina. Tudo isso eu tive que aprender sozinho, no espelho do banheiro, errando e tentando de novo.", "Tenho, porém, uma lembrança boa, que guardo com todos os detalhes. Eu estava na casa da minha avó Iraci e disse a ele que precisava fazer um para casa de folclore brasileiro: um resumo da Vitória-Régia. Ele pesquisou no computador para mim, e eu copiava. Mas eu tinha dificuldade em dar espaço entre as palavras, e foi então que ele pegou o meu dedinho e me ensinou: terminou uma palavra, coloca o dedo, e escreve depois dele. O meu dedo virou régua. Usei essa técnica por muito tempo. Foi a primeira e a única vez que meu pai me ajudou com um para casa. Eu não gostava de estudar, mas queria estar ali, só para ter aquele momento com ele. Pela primeira vez, senti que podia contar com o meu pai. Foi uma das sensações mais confortáveis da minha infância, justo numa época em que ele e a minha mãe brigavam muito, e em que eu, ainda criança, ficava no meio, levando recados e cobranças sobre a pensão atrasada. Hoje eu sei que ele também errava ao atrasar, mas para uma criança, aquilo pesava demais.", "Em casa, minha irmã lutava contra a depressão e a minha mãe trabalhava o dia inteiro para sustentar a gente. Então eu fiz o que sempre fiz: me virei. Fui me tornando o menino que resolve problemas, mesmo os que não eram dele."]}, {"t": "O silêncio", "svg": "", "p": ["Com o tempo, eu também adoeci por dentro. Foi um período de depressão muito forte, e eu me perguntava por que tanta coisa pesada tinha de acontecer comigo. Cheguei a perguntar a Jesus, sem rodeios: por quê?", "Vivi coisas que nenhuma criança deveria viver, inclusive ter sido assediado, uma ferida que carrego em silêncio e que não preciso detalhar aqui. Eu me sentia pobre, burro, feio, magro demais. Comecei a trabalhar cedo, e o trabalho virou a minha vida. E, de tanto me proteger, fui ficando frio. Não por falta de amor, mas por excesso de dor.", "Num dos meus aniversários, eu estava muito mal por dentro, mas quis fazer uma festa, só para os meus amigos. Fui para a pizzaria e esperei. Ninguém foi. Fiquei sozinho, comi um hambúrguer, agradeci e fui embora.", "Quando cheguei em casa, minha mãe perguntou se tinha sido bom. Eu sorri e disse que tinha me divertido muito, que tinha rido demais com meus amigos, e que eles precisaram ir embora cedo, por isso eu voltei cedo. Era mentira. Eu menti para proteger a minha mãe da minha tristeza, do mesmo jeito que sempre tentei proteger todo mundo.", "Teve também uma experiência espiritual muito forte, que me marcou e me fez sentir que existe algo maior do que a gente. Desde então, Deus nunca saiu da minha vida."]}, {"t": "Onde eu cheguei", "svg": "", "p": ["O tempo passou, e eu nunca parei de trabalhar. Aos 19 anos, estava num trabalho temporário quando recebi a notícia de que o Pedro, meu irmão de coração, tinha morrido, atropelado por um ônibus enquanto mexia no celular. Perdi um irmão que cresceu junto comigo, e mais uma vez segui em frente.", "Aos 23 anos, sou o mais novo da mesa nas reuniões da empresa que eu amo, e quem vem logo depois de mim tem 37. Tudo o que sei, aprendi sozinho, sem faculdade e sem certificado, só com vontade. Teve fase em que trabalhei o dia inteiro na empresa e rodei de Uber à noite, e fiquei cansado e chateado, sim. Mas segui, porque dinheiro nunca foi só dinheiro para mim: era a chance de dar a quem eu amo o que me faltou.", "E então conheci a pessoa que hoje é a mulher da minha vida. Com ela vieram os pais dela, que me receberam como filho. O meu sogro virou referência: tudo o que preciso conversar, de emprego a vida, eu levo para ele. A minha sogra deixou a carreira de lado para cuidar da filha, e tem um amor tão grande que ensina só de existir.", "Foi a primeira vez que vi o que é uma casa onde as pessoas se cuidam, e foi por isso que a cena da cozinha me desmontou. Hoje, o meu maior sonho é ver a minha noiva entrando de braço dado com o pai dela, caminhando até o altar, e ouvir dele, só com o olhar: “cuida dela para mim”. E eu vou cuidar, como ele cuidaria, com a vida inteira.", "Minha mãe ainda carrega a tristeza. Ela não teve inteligência emocional para me ensinar tudo, mas tem uma energia linda, e deu o que tinha, até a última refeição. Eu a amo e a respeito, e minha dor é ver que ela ainda sofre."]}];
const $=q=>document.querySelector(q),book=$('#book'),M=$('#measure'),pos=$('#pos');
const PW=420,PH=600,SPLIT=/(?<=[.!?:”])\s+/,el=t=>document.createElement(t);
let pages=[],sheets=[],s=0,single=false,N=0,ready=false;
function paginate(){
 pages=[];
 for(const ch of CH){
  let cur,txt;
  const start=f=>{cur=el('div');cur.className='in';cur.innerHTML=f?'<h2>'+ch.t+'</h2><i class="rule"></i>'+(ch.svg?'<div class="ill">'+ch.svg+'</div>':''):'<div class="run">'+ch.t+'</div>';txt=el('div');cur.append(txt);M.innerHTML='';M.append(cur)};
  const over=()=>cur.scrollHeight>cur.clientHeight+1;
  const flush=()=>{pages.push(cur.innerHTML);start(false)};
  start(true);
  for(const text of ch.p){
   const p=el('p');txt.append(p);p.textContent=text;
   if(!over())continue;
   p.remove();
   const ss=text.split(SPLIT);let i=0;
   while(i<ss.length){
    let buf='';const q=el('p');txt.append(q);
    while(i<ss.length){const t=buf?buf+' '+ss[i]:ss[i];q.textContent=t;if(over())break;buf=t;i++}
    if(buf)q.textContent=buf;
    else{q.remove();if(!txt.children.length){const f=el('p');f.textContent=ss[i++];txt.append(f)}}
    if(i<ss.length)flush();
   }
  }
  pages.push(cur.innerHTML);
 }
}
function build(){
 single=innerWidth<900;book.className=single?'single':'';book.style.width=(single?PW:PW*2)+'px';book.innerHTML='';sheets=[];
 const pg=i=>i<pages.length?'<div class="in">'+pages[i]+'</div><span class="num">'+(i+1)+'</span>':'';
 const defs=[[$('#cover-tpl').innerHTML,'']];
 if(single)pages.forEach((_,i)=>defs.push([pg(i),'']));
 else for(let i=0;i<pages.length;i+=2)defs.push([pg(i),pg(i+1)]);
 defs.forEach(([f,b],i)=>{const e=el('div');e.className='sheet';e.innerHTML='<div class="face front'+(i?'':' cover')+'">'+f+'</div><div class="face back">'+b+'</div>';book.append(e);sheets.push(e)});
 N=sheets.length;ready=false;render();ready=true;
}
function render(){
 const max=single?N-1:N;s=Math.max(0,Math.min(max,s));
 sheets.forEach((e,i)=>{const was=e.classList.contains('flipped'),now=i<s;if(was!==now&&ready){e.classList.remove('goF','goB');void e.offsetWidth;e.classList.add(now?'goF':'goB')}e.classList.toggle('flipped',now);e.classList.toggle('top',i===s);e.style.zIndex=now?i+1:N-i});
 let tx=0;if(!single){if(s===0)tx=-PW/2;else if(s===N)tx=PW/2}
 const W=single?PW:PW*2,k=Math.min((innerWidth-16)/W,(innerHeight-84)/PH,1.4);
 book.style.transform='scale('+k+') translateX('+tx+'px)';
 const n=pages.length;pos.textContent=s===0?'Capa':'Página '+(single?s:Math.min(2*s-1,n))+' de '+n;
 $('#prev').disabled=s===0;$('#next').disabled=s===max;
}
book.addEventListener('animationend',e=>{if(e.target.classList.contains('sheet'))e.target.classList.remove('goF','goB')});
const go=d=>{s+=d;render()};
$('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
let d=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
book.addEventListener('pointerdown',e=>{const r=book.getBoundingClientRect();d={x:e.clientX,right:e.clientX>r.left+r.width/2,t0:performance.now(),moved:false,t:0,sh:null,fwd:true,id:e.pointerId}});
book.addEventListener('pointermove',e=>{
 if(!d)return;const dx=e.clientX-d.x;
 if(!d.moved){
  if(Math.abs(dx)<8)return;
  d.fwd=single?dx<0:d.right;
  const idx=d.fwd?s:s-1,max=single?N-1:N;
  if(idx<0||(d.fwd&&s>=max)||(!single&&(d.fwd?dx>0:dx<0))){d=null;return}
  d.sh=sheets[idx];d.moved=true;book.setPointerCapture(d.id);
  Object.assign(d.sh.style,{transition:'none',zIndex:N+2,visibility:'visible'});
 }
 const k=book.getBoundingClientRect().width/book.offsetWidth;
 d.t=clamp((d.fwd?-dx:dx)/(PW*k*1.1),0,1);
 const a=d.fwd?-180*d.t:-180+180*d.t;
 d.sh.style.transform='rotateY('+a+'deg) translateZ('+Math.sin(Math.PI*d.t)*60+'px)';
 d.sh.style.setProperty('--sh',Math.sin(Math.PI*d.t).toFixed(2));
});
function end(e){
 if(!d)return;const o=d;d=null;
 if(!o.moved){const r=book.getBoundingClientRect();go(e.clientX>r.left+r.width/2?1:-1);return}
 const commit=o.t>.3||(o.t>.08&&performance.now()-o.t0<300);
 const tg=o.fwd?(commit?-180:0):(commit?0:-180),sh=o.sh;
 sh.style.transition='transform .45s ease-out';sh.style.transform='rotateY('+tg+'deg)';sh.style.setProperty('--sh',0);
 setTimeout(()=>{sh.style.transition=sh.style.transform=sh.style.visibility='';sh.style.removeProperty('--sh');if(commit)s+=o.fwd?1:-1;ready=false;render();ready=true},470);
}
book.addEventListener('pointerup',end);
book.addEventListener('pointercancel',e=>{if(d&&!d.moved)d=null;else end(e)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
addEventListener('resize',()=>{
 if((innerWidth<900)!==single){const pn=single?s:(s===0?0:2*s-1);s=innerWidth<900?pn:(pn===0?0:Math.ceil(pn/2));build()}else render();
});
Promise.race([document.fonts.load('16px Lora').then(()=>document.fonts.ready),new Promise(r=>setTimeout(r,2500))]).then(()=>{paginate();build()});
</script>
